name: Binarios

# Arma dsound listo para usar (con ffmpeg incluido) para Windows y Linux.
# - tag v* (ej. v0.2.0): arma y publica un Release con los .zip
# - cambios en packaging/: arma y deja los .zip como artifacts del run
# - manual: Actions -> Binarios -> Run workflow. Con "version" (ej. 0.2.0)
#   crea el tag v<version> y publica el Release; vacio solo arma los .zip.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (ej. 0.2.0). Vacio = solo armar los binarios"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/dsound/dsound.exe
          - os: ubuntu-latest
            exe: dist/dsound/dsound
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dsound + PyInstaller
        run: pip install -e ".[build]"

      - name: Armar ejecutable (con ffmpeg)
        run: python packaging/build.py

      - name: Smoke test del ejecutable
        run: python packaging/smoke_test.py ${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: dsound-${{ matrix.os }}
          path: dist/dsound-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # tag push: usa ese tag. Manual: crea v<version> sobre el commit que se armo
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: dsound ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
